name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            platform_name: windows-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            platform_name: linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            platform_name: macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binaries and libraries
        run: cargo build --release --target ${{ matrix.target }} --bins --lib

      - name: Package Windows Artifacts
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force
          $staging = "r8-staging"
          New-Item -ItemType Directory -Path $staging -Force
          Copy-Item "target/${{ matrix.target }}/release/d8.exe" -Destination $staging/
          Copy-Item "target/${{ matrix.target }}/release/r8.exe" -Destination $staging/
          Copy-Item "target/${{ matrix.target }}/release/rd8.exe" -Destination $staging/
          Copy-Item "target/${{ matrix.target }}/release/rs8.exe" -Destination $staging/
          Copy-Item "target/${{ matrix.target }}/release/r8x.exe" -Destination $staging/
          if (Test-Path "target/${{ matrix.target }}/release/r8.dll") {
            Copy-Item "target/${{ matrix.target }}/release/r8.dll" -Destination $staging/
          }
          if (Test-Path "target/${{ matrix.target }}/release/r8.lib") {
            Copy-Item "target/${{ matrix.target }}/release/r8.lib" -Destination $staging/
          }
          Copy-Item "README.md" -Destination $staging/
          Copy-Item "LICENSE" -Destination $staging/
          Compress-Archive -Path "$staging/*" -DestinationPath "dist/r8-${{ matrix.platform_name }}.zip"
          if ("${{ github.ref_type }}" -eq "tag") {
            Copy-Item "dist/r8-${{ matrix.platform_name }}.zip" -Destination "dist/r8-${{ github.ref_name }}-${{ matrix.platform_name }}.zip"
          }

      - name: Package Unix Artifacts (Linux / macOS)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist
          staging="r8-staging"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/d8" "$staging/"
          cp "target/${{ matrix.target }}/release/r8" "$staging/"
          cp "target/${{ matrix.target }}/release/rd8" "$staging/"
          cp "target/${{ matrix.target }}/release/rs8" "$staging/"
          cp "target/${{ matrix.target }}/release/r8x" "$staging/"
          if [ -f "target/${{ matrix.target }}/release/libr8.so" ]; then
            cp "target/${{ matrix.target }}/release/libr8.so" "$staging/"
          fi
          if [ -f "target/${{ matrix.target }}/release/libr8.dylib" ]; then
            cp "target/${{ matrix.target }}/release/libr8.dylib" "$staging/"
          fi
          if [ -f "target/${{ matrix.target }}/release/libr8.a" ]; then
            cp "target/${{ matrix.target }}/release/libr8.a" "$staging/"
          fi
          cp README.md "$staging/"
          cp LICENSE "$staging/"
          tar -czvf "dist/r8-${{ matrix.platform_name }}.tar.gz" -C "$staging" .
          if [ "${{ github.ref_type }}" = "tag" ]; then
            cp "dist/r8-${{ matrix.platform_name }}.tar.gz" "dist/r8-${{ github.ref_name }}-${{ matrix.platform_name }}.tar.gz"
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: r8-${{ matrix.platform_name }}
          path: dist/*

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten release artifacts
        run: |
          mkdir -p release-dist
          find release-artifacts -type f -exec cp {} release-dist/ \;
          ls -la release-dist

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
